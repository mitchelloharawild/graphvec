url: https://pkg.mitchelloharawild.com/graphvec

template:
  bootstrap: 5
  params:
    bootswatch: cosmo
  includes:
    in_header: |
      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://track.mitchelloharawild.com/js/pa-hMJNm4vrMJmtfgDWedFn0.js"></script>
      <script>
        window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
        plausible.init()
      </script>

development:
  mode: auto

authors:
  Mitchell O'Hara-Wild:
    href: https://mitchelloharawild.com

reference:
- title: Graph vectors
  desc: Vectorised graph data structures.
  contents:
  - node_vec
  - edge_vec
  - agg_vec
  - agg_df

- title: Graph structure
  desc: Access the nodes and edges of a graph vector, and identify aggregated elements.
  contents:
  - nodes
  - edges
  - node_values
  - is_aggregated

- title: Interoperability
  desc: Convert graph vectors to other graph representations.
  contents:
  - as.igraph

- title: Graph operations
  desc: >
    Measure, traverse, and test the structure of a graph vector. Every
    operation accepts either orientation and returns a shape fixed by its
    name: `n_*`/`graph_*` scalars, `node_*` node-aligned results, `edge_*`
    edge-aligned results.
  contents:
  - n_nodes
  - node_degree
  - graph_density
  - node_neighbors
  - edge_incident
  - node_incident
  - edge_heads
  - node_is_isolated
  - edge_is_loop
  - graph_is_directed

- title: Developer tools
  desc: Low-level constructors for extending graphvec's classes.
  contents:
  - new_node_vec
  - new_edge_vec
