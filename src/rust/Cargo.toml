[package]
name = 'graphvec'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'graphvec'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
# The external pointer accessors extendr-api doesn't re-export (the
# protected slot, setting the address), for `graphvec_backend_revive()`.
extendr-ffi = '0.9.0'
rustworkx-core = '0.18'

[dev-dependencies]
# Only used by `cargo test`'s R-engine-backed tests below -- not part of the
# built R package (R CMD INSTALL never compiles the `dev-dependencies`/`test`
# target), so its own MSRV doesn't have to match this crate's `rust-version`.
extendr-engine = '0.9.0'

[profile.release]
lto = true
codegen-units = 1
# Integer overflow panics (an R error) instead of silently wrapping, e.g. a
# position conversion that slips past `GraphBackend::new()`'s range check.
overflow-checks = true
